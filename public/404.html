<!DOCTYPE html>

    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --blue: #185CB6; --blue-soft: #F2F6FC; --ink: #101828; --gray: #667085; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        color: var(--ink);
        background: linear-gradient(to bottom, var(--blue-soft), #FFFFFF);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        line-height: 1.6;
      }
      main { width: min(640px, 100%); }
      .logo { height: 44px; width: auto; display: block; margin-bottom: 40px; }
      .eyebrow {
        font-family: 'Archivo', system-ui, sans-serif;
        font-size: 0.78rem; font-weight: 700; letter-spacing: 0.18em;
        text-transform: uppercase; color: var(--blue); margin: 0 0 14px;
      }
      h1 {
        font-family: 'Archivo', system-ui, sans-serif;
        font-size: clamp(1.9rem, 5vw, 2.7rem); line-height: 1.12;
        letter-spacing: -0.02em; margin: 0 0 16px;
      }
      p { color: var(--gray); font-size: 1.05rem; margin: 0 0 28px; max-width: 46ch; }
      .acoes { display: flex; flex-wrap: wrap; gap: 12px; }
      a.botao {
        display: inline-flex; align-items: center; justify-content: center;
        min-height: 48px; padding: 12px 22px; border-radius: 999px;
        font-weight: 700; font-size: 0.98rem; text-decoration: none;
        border: 1.5px solid var(--blue);
      }
      a.principal { background: var(--blue); color: #FFFFFF; }
      a.secundario { background: #FFFFFF; color: var(--blue); }
      a.botao:focus-visible { outline: 3px solid #FFBD59; outline-offset: 2px; }
      .pe { margin-top: 32px; font-size: 0.92rem; color: var(--gray); }
      .pe a { color: var(--blue); font-weight: 600; }
      nav { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.95rem; }
      nav a { color: var(--blue); font-weight: 600; }
    </style>

    <main>

      <div class="acoes">

        <a class="botao secundario" href="https://wa.me/5551993307386?text=Ol%C3%A1!%20Vim%20pelo%20site%20da%20IBA%20e%20quero%20falar%20com%20voc%C3%AAs." target="_blank" rel="noopener noreferrer">Falar no WhatsApp</a>

      <nav aria-label="Páginas do site">
        <a href="/servicos">Serviços</a>
        <a href="/praxe">Praxe</a>
        <a href="/sobre">Sobre</a>
