    <!-- Tema: segue o navegador. O fundo certo já vem no primeiro quadro, antes do CSS. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
    <style>html{background:#FFFFFF}@media (prefers-color-scheme: dark){html{background:#0B1220}}</style>
    <script>
      // Movimento: liga a classe que autoriza o CSS a esconder conteúdo antes de revelar.
      // Só entra com JavaScript, requestAnimationFrame e SEM preferência por menos movimento.
      // Sem a classe, nenhuma regra esconde nada e o site aparece completo e estático (é o caso
      // de JavaScript desligado, navegador antigo e de quem pediu redução de movimento).
      (function () {
        try {
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
          if (!window.requestAnimationFrame) return
          document.documentElement.classList.add('movimento')
        } catch (e) {}
      })()
    </script>
